<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TriageAI - Redirecting</title>
<script>
(function(){
  var p = window.location.pathname.replace(/\/$/,'');
  if(p && p !== '/404'){
    window.location.replace(p + '.html');
  } else {
    document.getElementById('err').style.display='flex';
  }
})();
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:#0f172a;color:#fff;min-height:100vh;}
#err{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:2rem;}
h1{font-size:6rem;font-weight:800;background:linear-gradient(135deg,#3b82f6,#6366f1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;}
p{font-size:1.25rem;color:#94a3b8;margin:1rem 0 2rem;}
a{background:#3b82f6;color:#fff;padding:.75rem 2rem;border-radius:.5rem;text-decoration:none;font-weight:600;}
a:hover{background:#2563eb;}
</style>
</head>
<body>
<div id="err">
  <h1>404</h1>
  <p>Page not found — but we're here to help.</p>
  <a href="/">Back to Home</a>
</div>
</body>
</html>
