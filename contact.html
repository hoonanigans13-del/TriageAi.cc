<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triage AI — Contact</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #0F1113;
            color: #FFFFFF;
        }
        nav {
            background-color: #0A3D3F;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
        }
        nav a {
            color: #14C3C9;
            text-decoration: none;
            margin-left: 15px;
            font-weight: bold;
        }
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }
        h1 {
            color: #14C3C9;
            margin-bottom: 10px;
        }
        p {
            line-height: 1.6;
            color: #D9D9D9;
        }
        .section {
            background-color: #2F2F2F;
            padding: 20px;
            border-radius: 8px;
            margin-top: 25px;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 6px;
            border: none;
            background-color: #1C1E20;
            color: #FFFFFF;
        }
        button {
            margin-top: 15px;
            padding: 12px 20px;
            background-color: #14C3C9;
            color: #0F1113;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0FB2B7;
        }
    </style>
</head>
<body>

<nav>
    <div style="color:white; font-weight:bold;">Triage AI</div>
    <div>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="support.html">Support</a>
    </div>
</nav>

<div class="container">
    <h1>Contact Us</h1>
    <p>
        Have questions, feedback, or need support? Reach out using the form below.  
        Triage AI responds quickly — we keep things simple and direct.
    </p>

    <div class="section">
        <h2>Send a Message</h2>

        <form>
            <label>Name</label>
            <input type="text" placeholder="Your name">

            <label>Email</label>
            <input type="email" placeholder="you@example.com">

            <label>Message</label>
            <textarea rows="5" placeholder="How can we help?"></textarea>

            <button type="submit">Send Message</button>
        </form>
    </div>

    <div class="section">
        <h2>Direct Contact</h2>
        <p>Email: support@triageai.app</p>
        <p>Response Time: Usually within 24 hours</p>
    </div>
</div>

</body>
</html>
